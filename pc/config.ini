; Reverse Remote Play — PC configuration
; Phase 1 uses [input]; later phases add [video] and [adaptive].

[input]
; Address/port receive_input.py listens on.
listen_host = 0.0.0.0
listen_port = 47001
; Print every received packet (very spammy at 250 Hz).
debug = false

; Used by send_*.py (PC -> PS4 video).
[video]
; Current PS4 address on the LAN (verify: ping <ip> from the PC).
ps4_host = 192.168.1.14
; NOTE: the PS4 blocks binding some port ranges; 9025 is known to work.
video_port = 9025
width = 1280
height = 720
fps = 30
; Codec: mjpeg | h264.
;   mjpeg - Phase 2 MJPEG (FFmpeg/jpegenc). Works on Windows via gdigrab.
;           Needs 40-60 Mbps at 720p30 for good quality.
;   h264  - Phase 3 H.264 (GStreamer/openh264). Linux only (PipeWire portal).
;           Not available on Windows without GStreamer.
codec = mjpeg
; H.264 target bitrate in bits/s (codec = h264). The weak-network default is
; 2.5 Mbps; raise toward [adaptive] max_bitrate on a good link.
h264_bitrate = 2500000
; H.264 keyframe interval in frames; 0 = one per second. 60 = 2 s at 30 fps.
; This is only a safety net: the PS4 sends KEYFRAME_REQUEST when it loses a
; frame and the encoder emits an immediate IDR (see keyframe_on_demand).
h264_gop = 60
; Force an IDR as soon as the PS4 asks (Step 3). Recommended on weak links:
; a fixed GOP alone cannot recover faster than the next scheduled keyframe.
h264_keyframe_on_demand = true
; Intra-refresh recovers without a full-frame burst, but openh264enc has no
; such property. When true the helper logs a clear fallback to periodic IDRs.
h264_intra_refresh = false
; openh264 complexity: 0 low (fastest), 1 medium, 2 high.
h264_complexity = 0
; openh264 profile: constrained-baseline | baseline | main | high.
h264_profile = constrained-baseline
; Feedback channel (Step 2): the PS4 sends STATS once a second and
; KEYFRAME_REQUEST when it loses a frame. The sender listens here.
feedback_enabled = true
feedback_port = 47002
; Phase 2 (MJPEG) options:
; Capture backend: auto | wayland | x11.
;   auto    - PipeWire portal on Wayland, x11grab otherwise
;   wayland - Force PipeWire portal (GNOME/KDE Wayland; shows a share dialog
;             the first time, then caches a restore token in .portal_token)
;   x11     - Force x11grab (X11 sessions / XWayland only)
capture = auto
; ---- Quality scale (MJPEG only) ----------------------------------------
; The two legacy knobs use OPPOSITE scales:
;   quality         FFmpeg -q:v    2 = best  .. 31 = worst  (lower is better)
;   wayland_quality jpegenc q      0 = worst .. 100 = best  (higher is better)
; `quality_pct` below unifies them: 0 = worst .. 100 = best (higher is better).
; When set it overrides both keys. Leave commented out to use them directly.
; quality_pct = 60
; FFmpeg -q:v, 2 (best) .. 31 (worst)  [x11/gdigrab backend]
quality = 7
; jpegenc quality, 0 (worst) .. 100 (best)  [wayland backend].
; Text-heavy screens are JPEG's worst case: 10 ~= 90 KB per 720p frame.
wayland_quality = 10
; X11 display for x11grab (Linux only — ignored on Windows, which uses gdigrab)
; display = :0.0
; ffmpeg_input = -f v4l2 -i /dev/video0   ; optional raw capture override

[adaptive]
; Adaptive bitrate controller (Step 4). It consumes one PS4 STATS sample per
; second; `enabled = false` pins everything to the [video] values.
enabled = true
; Hard bounds (bits/s).
min_bitrate = 600000
max_bitrate = 6000000
; Lowest fps the quality ladder may pick (30 -> 20 -> 15).
min_fps = 15
; Loss above loss_threshold (%) multiplies the bitrate by decrease_factor;
; loss below loss_recover (%) counts as "clean". Between the two the controller
; holds (hysteresis, so a link sitting on the threshold cannot oscillate).
loss_threshold = 2.0
loss_recover = 1.0
decrease_factor = 0.75
; Additive increase: +increase_step (fraction) after increase_interval seconds
; of clean samples, and no sooner than cooldown seconds after a decrease.
increase_step = 0.05
increase_interval = 5
cooldown = 2
; Secondary stress signals that also trigger a decrease.
; jitter: the PS4's reported inter-arrival jitter.
; drop_ratio: fraction of attempts that lost a whole frame. An H.264 access
; unit is ~26 chunks, so 1% packet loss already loses ~23% of frames; a low
; threshold would override the 1-2% loss hysteresis. 0.45 (~2.3% packet loss)
; only catches a link that is dropping frames even though packet loss looks
; acceptable (decoder failures, stale chunks).
jitter_threshold_ms = 80
drop_ratio_threshold = 0.45
; At min_bitrate, lower fps after this many bad samples, then resolution
; (1280x720 -> 960x540 -> 640x360). It never upscales beyond [video] geometry.
escalate_after = 3
; Raise fps/resolution again only after this many stable seconds AND once the
; bitrate has recovered to its starting value.
restore_interval = 20

[stats]
; Legacy name for the feedback port; the sender only reads
; [video] feedback_port. Kept so older notes/scripts do not look broken.
listen_port = 47002

[log]
; PS4 debug log is sent here (pc/log_viewer.py).
listen_host = 0.0.0.0
listen_port = 47003
